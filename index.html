<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1720" />
    <meta name="description" content="Playbook de l'équipe : Dust 2, côté terro, Split A (3 Long + 2 Short)." />
    <title>Stratbook · Dust 2 Terro</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip" href="#consignes">Aller aux consignes</a>

    <header class="top">
      <div class="top__titles">
        <p class="top__map" id="map-label">Dust 2 · Terro</p>
        <h1 class="top__title" id="strat-title">Split A, 3 Long + 2 Short</h1>
      </div>
      <div class="top__actions">
        <!-- Icônes dessinées pour le projet, dans l'esprit d'iOS (les SF Symbols d'Apple ne sont pas utilisables sur le web). -->
        <button type="button" class="icon-btn" id="open-nicks" aria-haspopup="dialog" aria-label="Pseudos" title="Pseudos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" /><circle cx="12" cy="9.6" r="3.3" /><path d="M6.2 18.4c1.3-2.5 3.4-3.8 5.8-3.8s4.5 1.3 5.8 3.8" /></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--primary" id="share" aria-label="Partager" title="Partager">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5V3.5M8 7.2l4-3.9 4 3.9" /><path d="M8.5 10H7a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17 10h-1.5" /></svg>
        </button>
      </div>
    </header>

    <div class="controls">
      <nav class="views" aria-label="Choix de la vue">
        <div class="views__row" id="views"></div>
      </nav>
      <nav class="steps" aria-label="Étapes de la stratégie">
        <button type="button" class="steps__arrow" id="prev" aria-label="Étape précédente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <ol class="steps__dots" id="step-dots"></ol>
        <button type="button" class="steps__arrow" id="next" aria-label="Étape suivante">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </nav>
    </div>

    <main class="layout">
      <figure class="board">
        <div class="board__stage">
          <button type="button" class="play" id="play" aria-pressed="false" aria-describedby="play-hint">
            <svg class="play__icon play__icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" /></svg>
            <svg class="play__icon play__icon--stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
            <span class="play__label">Lecture</span>
          </button>
          <span class="sr" id="play-hint">Rejoue toute la stratégie, du départ à la dernière étape.</span>
          <div class="board__map" id="map"></div>
        </div>
      </figure>

      <section class="brief" id="consignes" aria-label="Consignes" tabindex="-1"></section>
    </main>

    <dialog class="nicks" id="nicks-dialog" aria-labelledby="nicks-title">
      <form method="dialog" class="nicks__form" id="nicks-form">
        <h2 id="nicks-title">Pseudos de l'équipe</h2>
        <p class="nicks__hint">Enregistrés sur ce téléphone et ajoutés au lien quand tu partages.</p>
        <div class="nicks__fields" id="nicks-fields"></div>
        <div class="nicks__actions">
          <button type="button" class="btn btn--ghost" id="nicks-cancel">Annuler</button>
          <button type="submit" class="btn btn--primary" value="save">Enregistrer</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="sr" id="announce" aria-live="polite"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
