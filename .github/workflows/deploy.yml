name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; un nouvel envoi annule la précédente.
# Groupe renommé le 22/10 : une exécution fantôme (bloquée « en cours » chez GitHub depuis 14 h 10)
# occupait l'ancien groupe « pages » et retenait toutes les publications suivantes en file d'attente.
concurrency:
  group: publication-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Mise en ligne dès que les tests unitaires et la construction passent (choix de Greg, 22/10).
  # Les tests de parcours (iPhone WebKit, Android, ordinateur) tournent en parallèle :
  # un échec est signalé dans GitHub mais ne bloque plus la publication.
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
